name: Remove Code Comments

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  remove-comments:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove comments from source code
        run: |
          python - <<'PY'
          from pathlib import Path
          import io
          import re
          import tokenize

          ROOT = Path('.')
          EXCLUDED = {'.git', '.venv', 'venv', 'node_modules', '__pycache__'}
          EXTENSIONS = {'.py', '.js', '.css', '.html', '.htm', '.sql', '.sh'}

          def strip_python(text):
              lines = text.splitlines(keepends=True)
              out = []
              first = True
              tokens = tokenize.generate_tokens(io.StringIO(text).readline)
              for tok in tokens:
                  if tok.type == tokenize.COMMENT:
                      if first and tok.string.startswith('#!'):
                          out.append(tok.string)
                      else:
                          out.append('')
                  else:
                      out.append(None)
                  first = tok.start[0] != 1
              result = list(lines)
              for tok, replacement in zip(tokenize.generate_tokens(io.StringIO(text).readline), out):
                  if tok.type == tokenize.COMMENT and not (tok.start[0] == 1 and tok.string.startswith('#!')):
                      line = result[tok.start[0] - 1]
                      result[tok.start[0] - 1] = line[:tok.start[1]] + ('\\n' if line.endswith('\\n') else '')
              return ''.join(result)

          def strip_c_style(text):
              out = []
              i = 0
              n = len(text)
              state = 'code'
              quote = ''
              while i < n:
                  c = text[i]
                  nxt = text[i + 1] if i + 1 < n else ''
                  if state == 'code':
                      if c in ('"', "'", '`'):
                          quote = c
                          state = 'string'
                          out.append(c)
                          i += 1
                      elif c == '/' and nxt == '*':
                          state = 'block'
                          out.append(' ')
                          i += 2
                      elif c == '/' and nxt == '/':
                          state = 'line'
                          out.append(' ')
                          i += 2
                      else:
                          out.append(c)
                          i += 1
                  elif state == 'string':
                      out.append(c)
                      if c == '\\\\' and i + 1 < n:
                          out.append(text[i + 1])
                          i += 2
                      elif c == quote:
                          state = 'code'
                          i += 1
                      else:
                          i += 1
                  elif state == 'block':
                      if c == '*' and nxt == '/':
                          state = 'code'
                          out.append(' ')
                          i += 2
                      else:
                          if c == '\\n':
                              out.append('\\n')
                          i += 1
                  else:
                      if c == '\\n':
                          state = 'code'
                          out.append('\\n')
                      i += 1
              return ''.join(out)

          def strip_sql(text):
              out = []
              i = 0
              n = len(text)
              state = 'code'
              quote = ''
              while i < n:
                  c = text[i]
                  nxt = text[i + 1] if i + 1 < n else ''
                  if state == 'code':
                      if c in ("'", '"', '`'):
                          quote = c
                          state = 'string'
                          out.append(c)
                          i += 1
                      elif c == '-' and nxt == '-':
                          state = 'line'
                          out.append(' ')
                          i += 2
                      elif c == '/' and nxt == '*':
                          state = 'block'
                          out.append(' ')
                          i += 2
                      else:
                          out.append(c)
                          i += 1
                  elif state == 'string':
                      out.append(c)
                      if c == quote and nxt == quote:
                          out.append(nxt)
                          i += 2
                      elif c == quote:
                          state = 'code'
                          i += 1
                      else:
                          i += 1
                  elif state == 'block':
                      if c == '*' and nxt == '/':
                          state = 'code'
                          out.append(' ')
                          i += 2
                      else:
                          if c == '\\n':
                              out.append('\\n')
                          i += 1
                  else:
                      if c == '\\n':
                          state = 'code'
                          out.append('\\n')
                      i += 1
              return ''.join(out)

          def strip_html(text):
              text = re.sub(r'<!--.*?-->', '', text, flags=re.S)
              return re.sub(r'\{#.*?#\}', '', text, flags=re.S)

          changed = []
          for path in ROOT.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in EXTENSIONS:
                  continue
              if any(part in EXCLUDED for part in path.parts):
                  continue
              try:
                  original = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if path.suffix.lower() == '.py':
                  updated = strip_python(original)
              elif path.suffix.lower() in {'.html', '.htm'}:
                  updated = strip_html(original)
              elif path.suffix.lower() == '.sql':
                  updated = strip_sql(original)
              else:
                  updated = strip_c_style(original)
              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print(f'Updated {len(changed)} files')
          for path in changed:
              print(path)
          PY

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No code comments found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.py' '*.js' '*.css' '*.html' '*.htm' '*.sql' '*.sh'
          git commit -m "chore: remove comments from source code"
          git push
