name: FresherFlow UI and accessibility

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fresherflow-ui-a11y-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-accessibility:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install browser test dependencies
        run: |
          npm install --no-save @playwright/test @axe-core/playwright
          npx playwright install chromium

      - name: Start FresherFlow
        env:
          HOST: 127.0.0.1
          PORT: 5000
          FRESHERFLOW_ENV: development
        shell: pwsh
        run: |
          $stdoutLog = Join-Path $env:RUNNER_TEMP "fresherflow.stdout.log"
          $stderrLog = Join-Path $env:RUNNER_TEMP "fresherflow.stderr.log"
          $pidFile = Join-Path $env:RUNNER_TEMP "fresherflow.pid"

          $server = Start-Process -FilePath "python" -ArgumentList @(
            "-m", "flask", "--app", "app", "run",
            "--host", "127.0.0.1", "--port", "5000"
          ) -PassThru -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog
          $server.Id | Out-File -FilePath $pidFile -Encoding ascii

          for ($attempt = 0; $attempt -lt 60; $attempt++) {
            try {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:5000/" -TimeoutSec 2
              if ($response.StatusCode -eq 200) {
                exit 0
              }
            } catch {
              Start-Sleep -Seconds 1
            }
          }

          if (Test-Path $stdoutLog) { Get-Content $stdoutLog }
          if (Test-Path $stderrLog) { Get-Content $stderrLog }
          exit 1

      - name: Run browser smoke and accessibility checks
        run: npx playwright test tests/browser/ui-accessibility.spec.cjs --reporter=list

      - name: Show application log on failure
        if: failure()
        shell: pwsh
        run: |
          $stdoutLog = Join-Path $env:RUNNER_TEMP "fresherflow.stdout.log"
          $stderrLog = Join-Path $env:RUNNER_TEMP "fresherflow.stderr.log"
          if (Test-Path $stdoutLog) { Get-Content $stdoutLog }
          if (Test-Path $stderrLog) { Get-Content $stderrLog }
