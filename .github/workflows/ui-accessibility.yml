name: FresherFlow UI and accessibility

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fresherflow-ui-a11y-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install browser test dependencies
        run: |
          npm install --no-save @playwright/test @axe-core/playwright
          npx playwright install --with-deps chromium

      - name: Start FresherFlow
        env:
          HOST: 127.0.0.1
          PORT: 5000
          FRESHERFLOW_ENV: development
        run: |
          python -m flask --app app run --host 127.0.0.1 --port 5000 > /tmp/fresherflow.log 2>&1 &
          echo $! > /tmp/fresherflow.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/fresherflow.log
          exit 1

      - name: Run browser smoke and accessibility checks
        run: npx playwright test tests/browser/ui-accessibility.spec.cjs --reporter=list

      - name: Show application log on failure
        if: failure()
        run: cat /tmp/fresherflow.log
