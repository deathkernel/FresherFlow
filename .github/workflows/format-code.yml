name: Format Code

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install formatters
        run: |
          python -m pip install --upgrade pip
          python -m pip install black djlint
          npm install --global prettier

      - name: Format Python
        run: |
          black . --exclude='(^|/)(\.git|\.venv|venv|node_modules)(/|$)'

      - name: Format Jinja/HTML templates
        run: |
          djlint templates --reformat --profile=jinja --indent=2

      - name: Format CSS and JavaScript
        run: |
          prettier --write "static/**/*.css" "static/**/*.js"

      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: format source files for readability"
          git push

# Keep source formatting consistent across the project.
