name: Format Code

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Remove comments from source code
        run: |
          python - <<'PY'
          from pathlib import Path
          import io
          import re
          import tokenize

          root = Path('.')
          extensions = {'.py', '.js', '.css', '.html', '.htm', '.sql', '.sh'}
          excluded = {'.git', '.venv', 'venv', 'node_modules', '__pycache__'}

          def python_comments(text):
              lines = text.splitlines(keepends=True)
              for tok in tokenize.generate_tokens(io.StringIO(text).readline):
                  if tok.type == tokenize.COMMENT and not (tok.start[0] == 1 and tok.string.startswith('#!')):
                      line = lines[tok.start[0] - 1]
                      lines[tok.start[0] - 1] = line[:tok.start[1]] + ('\n' if line.endswith('\n') else '')
              return ''.join(lines)

          def c_comments(text):
              out = []
              i = 0
              state = 'code'
              quote = ''
              while i < len(text):
                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ''
                  if state == 'code':
                      if c in ('"', "'", '`'):
                          quote = c
                          state = 'string'
                          out.append(c)
                          i += 1
                      elif c == '/' and n == '*':
                          state = 'block'
                          out.append(' ')
                          i += 2
                      elif c == '/' and n == '/':
                          state = 'line'
                          out.append(' ')
                          i += 2
                      else:
                          out.append(c)
                          i += 1
                  elif state == 'string':
                      out.append(c)
                      if c == '\\' and i + 1 < len(text):
                          out.append(text[i + 1])
                          i += 2
                      elif c == quote:
                          state = 'code'
                          i += 1
                      else:
                          i += 1
                  elif state == 'block':
                      if c == '*' and n == '/':
                          state = 'code'
                          out.append(' ')
                          i += 2
                      else:
                          out.append('\n' if c == '\n' else '')
                          i += 1
                  else:
                      if c == '\n':
                          state = 'code'
                          out.append('\n')
                      i += 1
              return ''.join(out)

          def sql_comments(text):
              return re.sub(r'--[^\n]*', '', c_comments(text))

          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in extensions:
                  continue
              if any(part in excluded for part in path.parts):
                  continue
              try:
                  original = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              suffix = path.suffix.lower()
              if suffix == '.py':
                  updated = python_comments(original)
              elif suffix in {'.html', '.htm'}:
                  updated = re.sub(r'<!--.*?-->', '', original, flags=re.S)
                  updated = re.sub(r'\{#.*?#\}', '', updated, flags=re.S)
              elif suffix == '.sql':
                  updated = sql_comments(original)
              else:
                  updated = c_comments(original)
              if updated != original:
                  path.write_text(updated, encoding='utf-8')
          PY

      - name: Install formatters
        run: |
          python -m pip install --upgrade pip
          python -m pip install black djlint
          npm install --global prettier

      - name: Format Python
        run: |
          black . --exclude='(^|/)(\.git|\.venv|venv|node_modules)(/|$)'

      - name: Format Jinja/HTML templates
        run: |
          djlint templates --reformat --profile=jinja --indent=2 || true

      - name: Format CSS and JavaScript
        run: |
          prettier --write "static/**/*.css" "static/**/*.js"

      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: remove comments from source code"
          git push
