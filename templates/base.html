<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}FresherFlow{% endblock %}</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/student.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/employer.css') }}">{% block head %}{% endblock %}</head><body>{% with messages=get_flashed_messages(with_categories=true) %}<div class="toast-stack">{% for category,message in messages %}<div class="toast-card {{ category }}">{{ message }}</div>{% endfor %}</div>{% endwith %}{% block body %}{% endblock %}<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="{{ url_for('static', filename='js/main.js') }}"></script>{% block scripts %}{% endblock %}</body></html>
