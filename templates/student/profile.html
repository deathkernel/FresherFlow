{% extends 'student/base.html' %}{% block student_content %}<div class="content-card profile-card reveal"><div class="section-head"><div><h2>My Profile</h2><p>Make your profile recruiter-ready.</p></div><span class="score">{{ profile.profile_strength }}%</span></div><div class="progress mb-4"><i style="width:{{ profile.profile_strength }}%"></i></div><form method="post" class="form-grid"><div><label>Full name</label><input class="form-control" value="{{ user.name }}" disabled></div><div><label>Email</label><input class="form-control" value="{{ user.email }}" disabled></div><div><label>Phone</label><input class="form-control" name="phone" value="{{ profile.phone or '' }}"></div><div><label>Education</label><input class="form-control" name="education" value="{{ profile.education or '' }}" placeholder="B.Tech Computer Science"></div><div class="full"><label>Skills</label><textarea class="form-control" name="skills" rows="3" placeholder="Python, SQL, HTML, JavaScript">{{ profile.skills or '' }}</textarea></div><div class="full"><label>Certifications</label><textarea class="form-control" name="certifications" rows="3">{{ profile.certifications or '' }}</textarea></div><div class="full"><button class="btn btn-primary">Save profile</button></div></form></div>{% endblock %}
