{% extends "student/base.html" %}
{% block title %}Change Password — FresherFlow{% endblock %}
{% block student_content %}
<section class="settings-card student-password-card">
  <div class="settings-card-head"><span class="settings-icon" aria-hidden="true">⌑</span><div><h2>Change password</h2><p>Use a unique password with at least 12 characters.</p></div></div>
  <form method="post" class="student-password-form" data-client-validate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label for="current-password" class="form-label">Current password</label><input id="current-password" class="form-control" type="password" name="current_password" autocomplete="current-password" required></div>
    <div class="mb-3"><label for="new-password" class="form-label">New password</label><input id="new-password" class="form-control" type="password" name="new_password" minlength="12" autocomplete="new-password" required></div>
    <div class="mb-3"><label for="confirm-password" class="form-label">Confirm new password</label><input id="confirm-password" class="form-control" type="password" name="confirm_password" minlength="12" autocomplete="new-password" required></div>
    <div class="d-flex flex-wrap gap-2"><a href="{{ url_for('settings.preferences') }}" class="btn btn-light">Back to settings</a><button type="submit" class="btn btn-primary">Change password</button></div>
  </form>
</section>
{% endblock %}
