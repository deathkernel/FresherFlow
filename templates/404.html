{% extends "base.html" %}
{% block title %}Not found — FresherFlow{% endblock %}
{% block body %}
  <div class="not-found-shell">
    <div class="not-found-card reveal">
      <div class="not-found-code">404</div>
      <span class="eyebrow">PAGE NOT FOUND</span>
      <h1>This page took a wrong turn.</h1>
      <p>The page you're looking for doesn't exist or may no longer be available.</p>
      <div class="not-found-actions">
        <a href="{{ url_for('index') }}" class="btn btn-primary">Back home</a>
        <a href="{{ url_for('dashboard_redirect') }}" class="btn btn-light">Go to dashboard</a>
      </div>
    </div>
  </div>
{% endblock %}
