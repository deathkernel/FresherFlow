{% extends 'employer/base.html' %}{% block employer_content %}<div class="content-card reveal"><div class="section-head"><div><h2>Post a New Vacancy</h2><p>Create a role and publish it directly to the student opportunity feed.</p></div></div><form method="post" class="form-grid"><div class="full"><label>Job / internship title</label><input class="form-control" name="title" required placeholder="e.g. Python Developer Intern"></div><div><label>Type</label><select class="form-select" name="vacancy_type" required><option>Internship</option><option>Entry-level Job</option></select></div><div><label>Location</label><input class="form-control" name="location" required placeholder="Pune / Remote"></div><div><label>Salary / stipend</label><input class="form-control" name="salary" placeholder="₹20,000/mo or ₹6 LPA"></div><div><label>Application deadline</label><input class="form-control" type="date" name="deadline"></div><div class="full"><label>Skills</label><input class="form-control" name="skills" placeholder="Python, Flask, SQL"></div><div class="full"><label>Eligibility</label><input class="form-control" name="eligibility" placeholder="Freshers / 0–1 years / B.Tech..."></div><div class="full"><label>Role description</label><textarea class="form-control" name="description" rows="6" required placeholder="Describe responsibilities, team and expectations..."></textarea></div><div class="full form-actions"><button class="btn btn-light" name="publish" value="0">Save draft</button><button class="btn btn-primary" name="publish" value="1">Publish vacancy</button></div></form></div>{% endblock %}
