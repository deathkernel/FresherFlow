{% extends 'employer/base.html' %}{% block employer_content %}<div class="content-card reveal"><div class="section-head"><div><h2>Edit Vacancy</h2><p>Keep the role details accurate and useful for candidates.</p></div></div><form method="post" class="form-grid"><div class="full"><label>Title</label><input class="form-control" name="title" value="{{ job.title }}" required></div><div><label>Type</label><select class="form-select" name="vacancy_type"><option {% if job.vacancy_type=='Internship' %}selected{% endif %}>Internship</option><option {% if job.vacancy_type=='Entry-level Job' %}selected{% endif %}>Entry-level Job</option></select></div><div><label>Location</label><input class="form-control" name="location" value="{{ job.location }}" required></div><div><label>Salary / stipend</label><input class="form-control" name="salary" value="{{ job.salary or '' }}"></div><div><label>Deadline</label><input class="form-control" type="date" name="deadline" value="{{ job.deadline or '' }}"></div><div class="full"><label>Skills</label><input class="form-control" name="skills" value="{{ job.skills or '' }}"></div><div class="full"><label>Eligibility</label><input class="form-control" name="eligibility" value="{{ job.eligibility or '' }}"></div><div class="full"><label>Description</label><textarea class="form-control" name="description" rows="6" required>{{ job.description }}</textarea></div><div class="full"><button class="btn btn-primary">Update vacancy</button></div></form></div>{% endblock %}
