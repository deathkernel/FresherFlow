{% extends "employer/base.html" %}
{% block employer_content %}
  <div class="content-card reveal form-page">
    <div class="section-head page-toolbar"><div><span class="eyebrow">HIRING</span><h2>Edit Vacancy</h2><p>Keep the role details accurate and useful for candidates.</p></div></div>
    <form method="post" class="form-grid">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="full"><label for="title">Title</label><input id="title" class="form-control" name="title" value="{{ job.title }}" required></div>
      <div><label for="type">Type</label><select id="type" class="form-select" name="vacancy_type"><option {% if job.vacancy_type == 'Internship' %}selected{% endif %}>Internship</option><option {% if job.vacancy_type == 'Entry-level Job' %}selected{% endif %}>Entry-level Job</option></select></div>
      <div><label for="location">Location</label><input id="location" class="form-control" name="location" value="{{ job.location }}" required></div>
      <div><label for="salary">Salary / stipend</label><input id="salary" class="form-control" name="salary" value="{{ job.salary or '' }}"></div>
      <div><label for="deadline">Deadline</label><input id="deadline" class="form-control" type="date" name="deadline" value="{{ job.deadline or '' }}"></div>
      <div class="full"><label for="skills">Skills</label><input id="skills" class="form-control" name="skills" value="{{ job.skills or '' }}"></div>
      <div class="full"><label for="eligibility">Eligibility</label><input id="eligibility" class="form-control" name="eligibility" value="{{ job.eligibility or '' }}"></div>
      <div class="full"><label for="description">Description</label><textarea id="description" class="form-control" name="description" rows="7" required>{{ job.description }}</textarea></div>
      <div class="full form-actions"><a href="{{ url_for('employer.vacancies') }}" class="btn btn-light">Cancel</a><button class="btn btn-primary" type="submit">Update vacancy</button></div>
    </form>
  </div>
{% endblock %}
