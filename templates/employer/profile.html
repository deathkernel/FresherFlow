{% extends 'employer/base.html' %}{% block employer_content %}<div class="content-card reveal"><div class="section-head"><div><h2>Organization Profile</h2><p>Give candidates a clear picture of your organization.</p></div></div><form method="post" class="form-grid"><div><label>Organization name</label><input class="form-control" name="organization_name" value="{{ profile.organization_name }}" required></div><div><label>Organization type</label><input class="form-control" name="organization_type" value="{{ profile.organization_type or '' }}" placeholder="Technology, Finance..."></div><div><label>Website</label><input class="form-control" name="website" value="{{ profile.website or '' }}"></div><div><label>Location</label><input class="form-control" name="location" value="{{ profile.location or '' }}"></div><div class="full"><label>Description</label><textarea class="form-control" name="description" rows="5">{{ profile.description or '' }}</textarea></div><div class="full"><button class="btn btn-primary">Save organization</button></div></form></div>{% endblock %}
