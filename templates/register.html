{% extends 'base.html' %}{% block title %}Create account — FresherFlow{% endblock %}{% block body %}<div class="auth-shell"><div class="auth-panel"><a class="brand mb-5 d-inline-block" href="{{ url_for('index') }}">Fresher<span>Flow</span></a><div class="auth-box reveal"><div class="eyebrow">GET STARTED</div><h1>Create your account.</h1><p>Use the role that matches how you use FresherFlow.</p><form method="post" class="mt-4"><label>Full name</label><input class="form-control form-control-lg" name="name" required><label class="mt-3">Email</label><input class="form-control form-control-lg" type="email" name="email" required><label class="mt-3">I am a</label><select class="form-select form-select-lg" name="role" id="role" required><option value="student">Student / Fresher</option><option value="employer">Employer / Recruiter</option></select><label class="mt-3">Password</label><input class="form-control form-control-lg" type="password" name="password" minlength="6" required><button class="btn btn-primary btn-lg w-100 mt-4">Create account</button></form><p class="auth-foot">Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a></p></div></div><div class="auth-art register-art"><div class="art-grid"></div><div class="art-copy"><span>01 → 02 → 03</span><h2>Profile.<br>Apply.<br>Grow.</h2></div></div></div>{% endblock %}
