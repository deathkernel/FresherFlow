{% extends 'base.html' %}

{% block title %}Login — FresherFlow{% endblock %}

{% block body %}
<div class="auth-shell">
  <div class="auth-panel">
    <a class="brand mb-5 d-inline-block" href="{{ url_for('index') }}">
      Fresher<span>Flow</span>
    </a>

    <div class="auth-box reveal">
      <div class="eyebrow">WELCOME BACK</div>
      <h1>Sign in to your workspace.</h1>
      <p>Use your FresherFlow account to continue.</p>

      <form method="post" class="mt-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label for="email">Email</label>
        <input id="email" class="form-control form-control-lg" type="email" name="email" required autofocus>

        <label class="mt-3" for="password">Password</label>
        <input id="password" class="form-control form-control-lg" type="password" name="password" required>

        <button class="btn btn-primary btn-lg w-100 mt-4" type="submit">Sign in</button>
      </form>

      <p class="auth-foot">
        New here? <a href="{{ url_for('auth.register') }}">Create an account</a>
      </p>
    </div>
  </div>

  <div class="auth-art">
    <div class="art-grid"></div>
    <div class="art-copy">
      <span>FresherFlow</span>
      <h2>Find a start.<br>Build your career.</h2>
    </div>
  </div>
</div>
{% endblock %}
