<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" role="img" aria-labelledby="title desc">
  <title id="title">FresherFlow</title>
  <desc id="desc">FresherFlow career platform logo with a flowing F, graduation cap and upward arrow.</desc>
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b7f4"/>
      <stop offset=".55" stop-color="#2765ee"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Brand mark -->
  <g transform="translate(18 24)">
    <path d="M105 36h80l-18 29h-48c-12 0-20 7-25 18l-23 45c-5 9-12 20-26 27 6-10 10-20 13-30l18-58c4-18 14-31 29-31z" fill="url(#flow)"/>
    <path d="M72 104h63l-16 28H81c-11 0-19 6-24 15l-15 28c-7 11-17 16-30 16 8-8 13-18 16-29l11-38c5-13 15-20 33-20z" fill="url(#accent)" opacity=".98"/>
    <path d="M48 133c-5 4-10 8-17 11 8-14 14-28 16-43l8-42c3-15 13-24 27-24h7l-13 26c-3 6-5 12-6 19l-7 35c-2 7-6 14-15 18z" fill="#102a56"/>
    <path d="M63 89c27-15 51-29 74-47" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
    <path d="M132 39l20 2-7 21" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Graduation cap -->
    <path d="M48 19 101 2l57 18-52 20L48 19z" fill="#0d2952"/>
    <path d="M73 31v18c0 10 11 18 26 18s26-8 26-18V31l-26 9-26-9z" fill="#173d77"/>
    <path d="M153 19v30" stroke="#0d2952" stroke-width="5" stroke-linecap="round"/>
    <path d="M153 50c0 7-4 12-8 16h16c-4-4-8-9-8-16z" fill="#0d2952"/>
    <circle cx="153" cy="49" r="4" fill="#149fe4"/>
  </g>

  <!-- Wordmark -->
  <text x="235" y="110" font-family="Inter, Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="-3.2" fill="#0f2346">Fresher</text>
  <text x="590" y="110" font-family="Inter, Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="-3.2" fill="url(#flow)">Flow</text>
  <text x="238" y="157" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="7" fill="#6d7686">FROM LEARNING TO EARNING</text>
</svg>